<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hanging by a Number</title>

    <link rel="stylesheet" href="./style.css">

    <script defer src="./data.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>

    <!-- Start/Title Screen Overlay -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-content">
            <h1>Hanging by a Number!</h1>
            <p id="title-tag">Guess the secret number or else........</p>
            <button id="startBtn">START</button>
        </div>
    </div>

    <main class="main-content">
        <h1>Hanging by a Number</h1>
        <p>Guess a whole number from 1 to 100.</p>
        <p>You have six chances. Use the higher or lower clues.</p>
    
    <div id="hangman" aria-hidden="true">
            <div class="base"></div>
            <div class="pole"></div>
            <div class="beam"></div>
            <div class="rope"></div>
            <div class="body-part head"></div>
            <div class="body-part torso"></div>
            <div class="body-part left-arm"></div>
            <div class="body-part right-arm"></div>
            <div class="body-part left-leg"></div>
            <div class="body-part right-leg"></div>
        </div>
        <section class="controls-panel" aria-label="Game controls">
        <p id="remaining-display"></p>
        <p id="result-display" role="status"></p>
        <label for="guess-input">Your guess</label>
        <input id="guess-input" type="number
               min="1" max="100" step="1" placeholder="1–100">
        <div class="buttons">
            <button id="guess" type="button">Submit Guess</button>
            <button id="random" type="button">Random</button>
            <button id="reset" type="button">Reset</button>
        </div>
        <p class="small-text">Random submits a number for you.</p>
        <p id="history-display"></p>
        </section>
        </div>
    </main>
</body>
</html>
