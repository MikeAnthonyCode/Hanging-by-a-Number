<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanging by a Number</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Isometra&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <script defer src="./data.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
    <div id="start-overlay" class="overlay">
        <div class="overlay-content">
            <h1 id="game-title">Hanging by a Number!</h1>
            <p id="title-tag">Guess the $ecret number or else........</p>
            <button id="startBtn">START</button>
        </div>
    </div>
    <main class="main-content">
        <h1>Hanging by a Number</h1>
        <p>(Poor Henry is counting on you!)</p>
        <p id="instructions">Guess a whole number from 1 to 100. Six wrong guesses lose the round.</p>
        <div class="difficulty-controls">
        </div>
        <div class="game-layout">
            <section class="drawing-panel" aria-label="Hangman">
<div id="hangman" aria-hidden="true">
            <div class="base"></div>
            <div class="pole"></div>
            <div class="beam"></div>
            <div class="rope"></div>
            <div class="body-part head"></div>
            <div class="body-part torso"></div>
            <div class="body-part left-arm"></div>
            <div class="body-part right-arm"></div>
            <div class="body-part left-leg"></div>
            <div class="body-part right-leg"></div>
        </div>
            </section>
        <section class="controls-panel" aria-label="Game controls">
        <p id="remaining-display"></p>
        <p id="result-display" role="status"></p>
        <label for="guess-input">Your guess</label>
        <input id="guess-input" type="number"
               min="1" max="100" step="1" placeholder="1–100">
        <div class="buttons">
            <button id="guess" type="button">Submit Guess</button>
            <button id="random" type="button">Random</button>
            <button id="reset" type="button">Reset</button>
        </div>
        <p class="small-text">Random submits a number for you.</p>
        <ul id="history-display"></ul>
        </section>
        </div>
    </main>
</body>
</html>
